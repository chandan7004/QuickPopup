<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="theme.css">
  <style>
    body { padding: 16px; min-width: 380px; font-size: 13px; }
    label { display: block; margin-bottom: 4px; font-weight: 600; }
    .row { margin-bottom: 18px; }
    .help { font-size: 12px; color: var(--muted); margin-top: 4px; }
    input[type=number] { width: 80px; }
    button { margin-right: 8px; }
    #status { font-size: 12px; color: var(--accent); min-height: 16px; }
  </style>
</head>
<body>
  <div class="row">
    <label for="enterMode">Enter opens a search in</label>
    <select id="enterMode">
      <option value="reuse">the last popup (replace it)</option>
      <option value="new">a new popup (never replace)</option>
    </select>
    <div class="help">⌘↵ does the other one. A replaced page is kept under “Recently closed”. Pinned popups are never replaced.</div>
  </div>
  <div class="row">
    <label for="cleanup">Auto-close idle popups after (minutes)</label>
    <input type="number" id="cleanup" min="0" step="1">
    <div class="help">0 = never. Pinned popups (Alt+Shift+L) are never auto-closed. Auto-closed popups go to “Recently closed”.</div>
  </div>
  <div class="row">
    <button id="resetBounds">Reset popup size/position</button>
    <button id="clearHistory">Clear recent + closed history</button>
  </div>
  <div class="row">
    <a href="#" id="welcome">Shortcuts &amp; how it works</a>
  </div>
  <div id="status"></div>
  <script src="options.js"></script>
</body>
</html>
